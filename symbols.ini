# Shared ValueMap./FlagMap./TextMap. sections provide labels for group fields.

[ValueMap.ExecMode]
0=Request
1=Instant
2=Market
3=Exchange

[ValueMap.TradeMode]
0=Disabled
1=Long only
2=Short only
3=Close only
4=Full access

[ValueMap.SwapMode]
0=Disabled
1=Points
2=Symbol currency
3=Margin currency
4=Group currency
5=Interest current
6=Interest open
7=Reopen by close price
8=Reopen by bid
9=Profit currency


[ValueMap.Swap3Day]
0=Sunday
1=Monday
2=Tuesday
3=Wednesday
4=Thursday
5=Friday
6=Saturday
7=Disabled


[ValueMap.IECheckMode]
0=Normal


[FlagMap.FillFlags]
